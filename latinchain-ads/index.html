        <style>
            #track {
                /* ADD THIS LINE: It prevents rendering flickering on scroll boundaries */
                backface-visibility: hidden;
                
                /* Prevents users from swiping left/right on touch devices */
                overflow-x: hidden; 
                
                /* Disables all touch-based panning and zooming interactions */
                /* touch-action: none; */
                
                /* Disables mouse-dragging if you had any CSS/JS enabling it */
                /* pointer-events: none; */
            }
            
            /* Base styles and Wrapper */
            .carousel-wrapper {
              position: relative;
              width: 100%;
              max-width: 800px; /* Limits size on desktop */
              margin: 0 auto;
            }

            /* The scrollable track */
            .carousel-track {
              display: flex;
              gap: 1rem;
              overflow-x: auto;
              scroll-snap-type: x mandatory;
              -webkit-overflow-scrolling: touch;
              scrollbar-width: none;
              position: relative; /* ADDED */
              /* REMOVED: scroll-behavior: smooth; */
            }

            /* Hides scrollbar in Chrome/Safari/Edge */
            .carousel-track::-webkit-scrollbar {
              display: none;
            }

            /* Individual Slides */
            .carousel-slide {
              flex: 0 0 100%; /* Mobile: 1 slide visible at a time */
              scroll-snap-align: center;
              height: 300px;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 2rem;
              font-family: sans-serif;
              color: #333;
              border-radius: 12px;
              transform: translate3d(0,0,0);
              transform-style: preserve-3d;
            }

            /* Navigation Buttons */
            .carousel-btn {
              position: absolute;
              top: 50%;
              transform: translateY(-50%);
              background: rgba(255, 255, 255, 0.8);
              border: none;
              width: 40px;
              height: 40px;
              border-radius: 50%;
              cursor: pointer;
              z-index: 10;
              box-shadow: 0 4px 6px rgba(0,0,0,0.1);
              display: none; /* Hide on mobile by default */
              color: black !important;
            }

            /* Media Query: Show buttons and adjust sizing for larger screens */
            @media (min-width: 768px) {
              .carousel-btn {
                display: block; /* Show buttons on tablets and up */
              }
              
              .prev { left: -20px; }
              .next { right: -20px; }
              
              .carousel-slide {
                height: 400px;
                /* Optional: Change flex to '0 0 calc(50% - 0.5rem)' to show 2 slides at a time */
              }
            }
        </style>
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const track = document.getElementById('track');

                // --- 1. FILTER VISIBLE SLIDES ONLY ---
                const originalVisibleSlides = Array.from(document.querySelectorAll('.carousel-slide'))
                    .filter(slide => {
                        const style = window.getComputedStyle(slide);
                        return style.display !== 'none' && slide.offsetWidth > 0;
                    });

                // Safety check: A carousel is only needed if there are 2 or more slides.
                if (originalVisibleSlides.length < 2) return;

                const intervalTime = 10000;
                let autoPlayTimer;
                let isTransitioning = false; 

                // --- 2. Create the Clones ---
                const firstClone = originalVisibleSlides[0].cloneNode(true);
                const lastClone = originalVisibleSlides[originalVisibleSlides.length - 1].cloneNode(true);

                firstClone.classList.add('carousel-clone');
                lastClone.classList.add('carousel-clone');

                track.appendChild(firstClone);
                track.insertBefore(lastClone, originalVisibleSlides[0]);

                // --- 3. Update arrays and track indices ---
                const allSlides = Array.from(document.querySelectorAll('.carousel-slide'));
                
                const allVisibleSlides = allSlides.filter(slide => {
                    const style = window.getComputedStyle(slide);
                    return style.display !== 'none' && slide.offsetWidth > 0;
                });

                const totalRealSlides = originalVisibleSlides.length;

                // --- 4. Initial Setup ---
                requestAnimationFrame(() => {
                    track.scrollLeft = allVisibleSlides[1].offsetLeft;
                });

                // --- 5. The Dynamic Width Calculation ---
                const getSlideWidth = () => {
                    if(allVisibleSlides.length < 3) return track.clientWidth;
                    return allVisibleSlides[2].offsetLeft - allVisibleSlides[1].offsetLeft;
                };

                // --- 6. The Boundary Loop Function ---
                const handleInfiniteLoopJumps = () => {
                    isTransitioning = false;
                    const currentScroll = track.scrollLeft;
                    const maxScroll = track.scrollWidth - track.clientWidth;
                    const buffer = 2; 

                    if (currentScroll < buffer+1) {
                        track.style.scrollSnapType = 'none';
                        requestAnimationFrame(() => {
                            track.scrollLeft = allVisibleSlides[totalRealSlides].offsetLeft;
                            requestAnimationFrame(() => {
                                track.style.scrollSnapType = 'x mandatory'; 
                            });
                        });
                    }
                    else if (currentScroll >= maxScroll - buffer) {
                        track.style.scrollSnapType = 'none';
                        requestAnimationFrame(() => {
                            track.scrollLeft = allVisibleSlides[1].offsetLeft;
                            requestAnimationFrame(() => {
                                track.style.scrollSnapType = 'x mandatory'; 
                            });
                        });
                    }
                };

                // --- 7. Listen for `scrollend` ---
                if ('onscrollend' in track) {
                    track.addEventListener('scrollend', handleInfiniteLoopJumps);
                } else {
                    let scrollTimer;
                    track.addEventListener('scroll', () => {
                        clearTimeout(scrollTimer);
                        scrollTimer = setTimeout(handleInfiniteLoopJumps, 60); 
                    });
                }

                // --- 8. AutoPlay Logic ---
                const moveToNextSlide = () => {
                    if (isTransitioning) return;
                    isTransitioning = true;
                    track.scrollBy({ left: getSlideWidth(), behavior: 'smooth' });
                };

                const startAutoPlay = () => {
                    if (autoPlayTimer) clearInterval(autoPlayTimer);
                    autoPlayTimer = setInterval(moveToNextSlide, intervalTime);
                };

                // --- 9. Window Resizing ---
                window.addEventListener('resize', () => {
                    if (autoPlayTimer) clearInterval(autoPlayTimer);
                    
                    const currentScroll = track.scrollLeft;
                    let closestIndex = 1;
                    let minDiff = Infinity;
                    
                    for (let i = 1; i < totalRealSlides+1; i++) {
                        const diff = Math.abs(allVisibleSlides[i].offsetLeft - currentScroll);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIndex = i;
                        }
                    }
                    
                    track.style.scrollSnapType = 'none';
                    track.scrollLeft = allVisibleSlides[closestIndex].offsetLeft;
                    track.style.scrollSnapType = null;
                    startAutoPlay();
                });

                // Start the autoplay timer!
                startAutoPlay();
            });
            
            window.addEventListener('load', function() {
                setTimeout(function() {
                    window.dispatchEvent(new Event('resize'));
                }, 500);
            });
        </script>
